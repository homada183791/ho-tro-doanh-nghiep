
<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LegalBiz AI · Trợ lý hồ sơ doanh nghiệp</title>
    <meta name="theme-color" content="#F6F7F4" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      /*
       * Bảng màu "hồ sơ giấy" của LegalBiz:
       *  - brand  (mực xanh lục): nút chính, liên kết, ô đang chọn. Thay cho blue/indigo/purple mặc định.
       *  - slate  (xám pha mực):   chữ, viền, nền phụ. Thay cho slate/gray mặc định.
       *  - seal   (đỏ con dấu):    chỉ dùng cho logo và mục đang chọn ở thanh bên.
       * Độ tương phản đã kiểm tra theo WCAG AA (chữ >= 4.5:1, viền ô nhập >= 3:1).
       */
      const brand = { 50:'#EEF6F5',100:'#D6EBE9',200:'#AED6D2',300:'#7DBAB5',400:'#4C9A95',500:'#2A7C79',600:'#0F5E63',700:'#0B4A4E',800:'#0A3A3E',900:'#0A2F33',950:'#061C1F' };
      const ink   = { 50:'#F6F7F4',100:'#EDF1EF',200:'#D9E1DF',300:'#859699',400:'#64777B',500:'#52666A',600:'#405357',700:'#2F4246',800:'#1E3136',900:'#12262B',950:'#0B1A1E' };
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ['"Be Vietnam Pro"', 'system-ui', '"Segoe UI"', 'Roboto', 'sans-serif'] },
            colors: {
              blue: brand, indigo: brand, purple: brand, violet: brand, sky: brand,
              slate: ink, gray: ink,
              seal: { 50:'#FCEEED',100:'#F8D6D3',500:'#C9372D',600:'#B3261E',700:'#921F18' },
              paper: '#F6F7F4',
            },
            borderRadius: { lg: '8px', xl: '10px', '2xl': '14px', '3xl': '18px' },
            boxShadow: {
              sm: '0 1px 2px rgba(18,38,43,0.06)',
              DEFAULT: '0 1px 3px rgba(18,38,43,0.08)',
              md: '0 4px 12px -4px rgba(18,38,43,0.12)',
              lg: '0 10px 24px -10px rgba(18,38,43,0.18)',
              xl: '0 16px 36px -14px rgba(18,38,43,0.22)',
              '2xl': '0 24px 48px -18px rgba(18,38,43,0.28)',
            },
          },
        },
      };
    </script>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.41.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.564.0",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react-markdown": "https://esm.sh/react-markdown@^10.1.0",
    "path": "https://esm.sh/path@^0.12.7",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.4",
    "xlsx": "https://esm.sh/xlsx@0.18.5"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
